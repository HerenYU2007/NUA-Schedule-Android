name: APK download statistics

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  push:
    paths:
      - '.github/workflows/apk-download-stats.yml'
      - 'tools/apk-download-stats.cjs'
      - 'tools/apk-download-stats.test.cjs'

permissions:
  contents: write

concurrency:
  group: apk-download-statistics
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'HerenYU2007/NUA-Schedule-Android'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test counter and chart logic
        run: node --test tools/apk-download-stats.test.cjs
      - name: Collect APK counters and render daily chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/apk-download-stats.cjs
      - name: Commit statistics only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md docs/downloads/history.json docs/downloads/apk-downloads.svg
          if git diff --cached --quiet; then
            echo 'No counter/date change; keeping the existing chart.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh daily APK download totals [skip ci]'
          git push origin "HEAD:${DEFAULT_BRANCH}"
